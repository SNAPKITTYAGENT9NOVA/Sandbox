name: lean-m2 workstation (G0)

# Builds the LEAN-M2-CC-001 toolchain image on a NATIVE AArch64 runner and runs the
# G0 toolchain probe (CompCert 3.18 / gm2 / Lean via elan, linked ABI probe).
# Publishes the image to GHCR only from main or a manual run, never from a PR.

on:
  pull_request:
    paths: ['lean-m2/docker/**', 'lean-m2/scripts/**', 'lean-m2/fixtures/**', '.github/workflows/lean-m2-workstation.yml']
  push:
    branches: [main]
    paths: ['lean-m2/docker/**', 'lean-m2/scripts/**', 'lean-m2/fixtures/**', '.github/workflows/lean-m2-workstation.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lean-m2-g0-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/snapkittyagent9nova/lean-m2-workstation

jobs:
  g0:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (linux/arm64, native)
        uses: docker/build-push-action@v6
        with:
          context: lean-m2
          file: lean-m2/docker/Dockerfile
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=lean-m2
          cache-to: type=gha,scope=lean-m2,mode=max

      - name: Measure image pins (base-image digest, Menhir)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p results
          ref=$(awk '/^FROM /{for(i=1;i<=NF;i++) if($i !~ /^--/ && $i != "FROM"){print $i; exit}}' lean-m2/docker/Dockerfile)
          tag=${ref%%@*}
          {
            echo "dockerfile_from $ref"
            echo "tag_index_digest $(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
            echo "tag_arm64_digest $(docker buildx imagetools inspect "$tag" --raw | python3 -c 'import json,sys;print([m["digest"] for m in json.load(sys.stdin)["manifests"] if m["platform"].get("architecture")=="arm64" and m["platform"].get("os")=="linux"][0])')"
            echo "menhir $(docker run --rm --platform linux/arm64 "$IMAGE:ci" bash -lc 'eval "$(opam env --switch=default)"; menhir --version' 2>&1 | tail -1)"
          } | tee results/pins.txt
          lean-m2/scripts/annotate.sh notice "Image pins (measured)" results/pins.txt 10
          # fail closed: the Dockerfile must pin the base by digest, and that digest and the measured
          # Menhir version must equal what workstation.lock.yaml records
          lock=lean-m2/workstation.lock.yaml
          want_base=$(awk '/^  base_image:/{b=1} b&&/^    digest:/{print $2; exit}' $lock)
          want_menhir=$(awk '/^    menhir:/{gsub(/"/,"",$2); print $2; exit}' $lock)
          got_menhir=$(awk '/^menhir /{print $NF}' results/pins.txt)
          bad=0
          [[ "$ref" == *@sha256:* ]] || { echo "::error title=Image pins::Dockerfile FROM is not pinned by digest: $ref"; bad=1; }
          [ "${ref#*@}" = "$want_base" ] || { echo "::error title=Image pins::Dockerfile digest ${ref#*@} != lock $want_base"; bad=1; }
          [ "$got_menhir" = "$want_menhir" ] || { echo "::error title=Image pins::measured menhir $got_menhir != lock $want_menhir"; bad=1; }
          exit $bad

      - name: G0 probe (toolchain only)
        run: |
          mkdir -p results
          docker run --rm --platform linux/arm64 \
            -e LEAN_M2_EXECUTION=native \
            -v "$PWD/results:/results" \
            "$IMAGE:ci" \
            bash -c 'OUT=/results/g0 /opt/lean-m2/scripts/probe-toolchain.sh --toolchain-only'

      - name: Show G0 checks (also as annotations, readable via the REST API)
        if: always()
        run: |
          cat results/g0/checks.tsv || true
          lean-m2/scripts/annotate.sh notice "G0 checks" results/g0/checks.tsv 80
          # one annotation per blocked check, carrying the tail of that check's own log
          n=0
          while IFS=$'\t' read -r st name detail; do
            [ "$st" = BLOCKED ] || continue
            n=$((n+1)); [ "$n" -le 8 ] || break
            log="results/g0/${name}.log"
            [ "$name" = abi-runtime ] && log="results/g0/abi-runtime.log"
            if [ -f "$log" ]; then
              { echo "detail: $detail"; tail -n 40 "$log"; } > "$RUNNER_TEMP/ann.txt"
              lean-m2/scripts/annotate.sh error "G0 BLOCKED: $name" "$RUNNER_TEMP/ann.txt" 45
            else
              echo "::error title=G0 BLOCKED: $name::$detail"
            fi
          done < results/g0/checks.tsv

      - name: Upload G0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-toolchain-evidence
          path: results/g0/

      - name: Publish image
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:ci" "$IMAGE:main"
          docker tag "$IMAGE:ci" "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"
          docker push "$IMAGE:${{ github.sha }}"
          docker image inspect "$IMAGE:main" --format '{{json .RepoDigests}}' | tee results/image-digest.json
          lean-m2/scripts/annotate.sh notice "Published image digest" results/image-digest.json 5
