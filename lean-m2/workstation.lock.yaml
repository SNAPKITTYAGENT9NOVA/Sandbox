# Workstation image pins for LEAN-M2-CC-001.
# Kept separate from toolchain.lock.yaml so the frozen contract schema (1.0.0) is not modified.
# Values marked "observed" were measured; REQUIRED values block release until measured on a real build.
workstation:
  schema_version: "0.1.0"
  platform: linux/arm64
  base_image:
    reference: ubuntu:24.04
    digest: sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac   # tag index, observed G0 run 39132300105
    arm64_manifest_digest: sha256:18b33ff3829707f31ada654a963b9ee35f2e6f0241b964bd17a22a9b330cb63d   # observed, same run
  compcert_source:
    repository: https://github.com/AbsInt/CompCert
    tag: v3.18
    tag_commit: 14d616046360a0b2611ebdfc2f98368af402e1f7   # observed via git ls-remote, 2026-10-14
    commit: 8135de0cc006f094e4a96aff9bb76cf716c9065a       # child of tag_commit; diff = VERSION only (3.17 -> 3.18)
    pin_rationale: >-
      The tagged commit's VERSION file says 3.17, so a ccomp built from it reports 3.17 and
      fails the exact-version gate (observed in CI on native aarch64, 2026-10-14). Upstream
      commit 8135de0 "Update CompCert version to match latest release" changes only VERSION.
      The Dockerfile verifies tag_commit, commit, and that the diff touches only VERSION.
    configure: "-prefix /opt/compcert aarch64-linux"
  compcert_build_deps:
    ocaml: "4.14.2"
    coq: "8.20.1"               # within CompCert 3.18's documented Coq 8.15.0-8.20.1 range
    menhir: "20260209"          # observed G0 run 39132300105 (menhir --version); pinned in Dockerfile
  gm2:
    source: ubuntu-noble-archive
    package: gm2                # noble archive lists 4:13.2.0-7ubuntu1 (GCC 13.2) with arm64; installed version is recorded by G0
  lean:
    installer: elan
    default_toolchain: none     # each project's lean-toolchain decides
  image:
    reference: ghcr.io/snapkittyagent9nova/lean-m2-workstation:c73046e6752db822cdaef261bc8ddb2eedd5c486   # immutable tag; :main moves with each main build
    digest: sha256:33b225d6fa4f92ab4b267b4cf2546317dd75df7f86cbfa6c645e15b51f43c3d2   # published by G0 on main (run 39327716187, commit c73046e)
  execution:
    native: accepted
    emulated: blocked-unless-LEAN_M2_ALLOW_EMULATION=1   # QEMU then joins the trusted base
