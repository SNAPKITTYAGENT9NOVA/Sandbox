name: lean-m2 MathIR (generator)

# LEAN-M2-CC-001 G3/G5 generator:
#   job lean (x86-64): MathIR export + C/Modula-2 codegen + Lean reference vectors, inside the frozen corpus;
#                      also SLICE-001's Spec.lean vectors for the acceptance test
#   job arm  (native AArch64): ccomp + gm2 build of the GENERATED code; generic differential test and
#                      acceptance test (SLICE-001's driver and cases against the generated firstKindTerm)

on:
  pull_request:
    paths: ['lean-m2/tools/mathir_body.lean', 'lean-m2/tools/test/**', 'build.sh', '.githooks/**', 'lean-m2/g3/gen/**', 'lean-m2/g3/slice001/**', 'lean-m2/scripts/annotate.sh', '.github/workflows/lean-m2-mathir.yml']
  push:
    branches: [main]
    paths: ['lean-m2/tools/mathir_body.lean', 'lean-m2/tools/test/**', 'build.sh', '.githooks/**', 'lean-m2/g3/gen/**', 'lean-m2/g3/slice001/**', 'lean-m2/scripts/annotate.sh', '.github/workflows/lean-m2-mathir.yml']
  workflow_dispatch:
  workflow_call:          # used by the release workflow (lean-m2-release.yml)

permissions:
  contents: read

concurrency:
  group: lean-m2-mathir-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # fast: elaborate the exporter against Lean core only (no Mathlib, no corpus) to catch compile errors early
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the corpus Lean toolchain
        run: |
          V=$(awk -F'"' '/^  lean_toolchain:/{print $2; exit}' lean-m2/corpus.lock.yaml)
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$V"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Local build check (build.sh, the same checks the pre-push hook runs)
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          set +e
          LEAN="$(command -v lean)" ./build.sh > "$RUNNER_TEMP/build.log" 2>&1; rc=$?; set -e
          cat "$RUNNER_TEMP/build.log"
          lean-m2/scripts/annotate.sh "$([ $rc -eq 0 ] && echo notice || echo error)" "build.sh" "$RUNNER_TEMP/build.log" 80
          exit $rc
      - name: Compile-check mathir_body.lean (empty module list)
        run: |
          { echo "import Lean"; cat lean-m2/tools/mathir_body.lean; } > "$RUNNER_TEMP/Check.lean"
          : > "$RUNNER_TEMP/empty.tsv"
          set +e
          MATHIR_OUT="$RUNNER_TEMP/out" MATHIR_MODS="$RUNNER_TEMP/empty.tsv" lean "$RUNNER_TEMP/Check.lean" > "$RUNNER_TEMP/check.log" 2>&1
          rc=$?; set -e
          grep -n 'error' "$RUNNER_TEMP/check.log" | head -40 > "$RUNNER_TEMP/err.txt" || true
          if [ $rc -ne 0 ]; then
            lean-m2/scripts/annotate.sh error "MathIR compile-check errors (first 40)" "$RUNNER_TEMP/err.txt" 40
            cat "$RUNNER_TEMP/check.log"; exit 1
          fi
          tail -3 "$RUNNER_TEMP/check.log"

  lean:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CORPUS: ${{ github.workspace }}/corpus
      EVID: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Fetch corpus at the locked commit
        run: |
          COMMIT=$(awk '/^  commit:/{print $2; exit}' lean-m2/corpus.lock.yaml)
          REPO=$(awk '/^  repository:/{print $2; exit}' lean-m2/corpus.lock.yaml)
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          git init -q "$CORPUS"
          git -C "$CORPUS" fetch -q --depth 1 "$REPO" "$COMMIT"
          git -C "$CORPUS" checkout -q FETCH_HEAD
          test "$(git -C "$CORPUS" rev-parse HEAD)" = "$COMMIT"
          mkdir -p "$EVID"

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: G1 inventory (Lean) and corpus verification
        run: |
          (cd "$CORPUS" && lean --run "$GITHUB_WORKSPACE/lean-m2/tools/G1Inventory.lean" . "$EVID/g1")
          (cd "$EVID/g1" && grep -v '^#' "$GITHUB_WORKSPACE/lean-m2/corpus/formal-conjectures/84cf7f8/EVIDENCE.sha256" | sha256sum -c -)

      - name: Restore corpus build cache
        uses: actions/cache/restore@v4
        with:
          path: corpus/.lake/build
          key: fc-build-${{ env.COMMIT }}-v1

      - name: Mathlib cache and corpus build
        working-directory: corpus
        run: |
          lake exe cache get 2>&1 | tail -3
          lake build 2>&1 | tail -5
          mkdir -p "$EVID" && lake --version | head -1 | tee "$EVID/lake-version.txt"

      - name: MathIR export, codegen and reference vectors
        working-directory: corpus
        run: |
          set -euo pipefail
          python3 - "$EVID/g1/inventory.json" "$EVID/modules.tsv" "$RUNNER_TEMP/MathIR.lean" \
              "$GITHUB_WORKSPACE/lean-m2/tools/mathir_body.lean" <<'PY'
          import json, sys
          inv, tsv, out, body = sys.argv[1:]
          mods = [f for f in json.load(open(inv))["files"] if f["module_components"] and f["built_by_default"]]
          with open(tsv, "w") as t:
              for f in mods:
                  t.write("\t".join([f["module_name"], *f["module_components"]]) + "\n")
          with open(out, "w") as o:
              o.write("import Lean\n")
              for f in mods:
                  o.write("import " + ".".join("«" + c + "»" for c in f["module_components"]) + "\n")
              o.write(open(body).read())
          PY
          set +e
          start=$(date +%s)
          MATHIR_OUT="$EVID/gen" MATHIR_MODS="$EVID/modules.tsv" lake env lean "$RUNNER_TEMP/MathIR.lean" > "$EVID/mathir.log" 2>&1
          rc=$?; set -e
          echo "mathir exit=$rc seconds=$(( $(date +%s) - start ))" | tee -a "$EVID/mathir.log"
          tail -30 "$EVID/mathir.log"
          test $rc -eq 0
          grep -q 'translated=' "$EVID/mathir.log"
          (cd "$EVID/gen" && sha256sum *) | tee "$EVID/gen.sha256"

      - name: SLICE-001 vectors (acceptance input)
        working-directory: corpus
        run: |
          SLICE_OUT="$EVID/slice001" lake env lean "$GITHUB_WORKSPACE/lean-m2/g3/slice001/Spec.lean" > "$EVID/spec.log" 2>&1
          grep '^SLICE001 cases=' "$EVID/spec.log"

      - name: Publish evidence as annotations
        if: always()
        run: |
          A=lean-m2/scripts/annotate.sh
          [ -f "$EVID/gen/report.txt" ] && $A notice "MathIR report" "$EVID/gen/report.txt" 400
          [ -f "$EVID/gen/blocked.txt" ] && $A notice "MathIR blocked" "$EVID/gen/blocked.txt" 300
          if [ -f "$EVID/gen/progress.log" ]; then
            { grep -E 'candidates=|done' "$EVID/gen/progress.log"; echo '--- slowest steps ---';
              awk '{t=$1+0; if (NR>1) print t-p, prev; p=t; prev=$0}' "$EVID/gen/progress.log" | sort -rn | head -12; } > "$RUNNER_TEMP/p.txt"
            $A notice "MathIR timings" "$RUNNER_TEMP/p.txt" 25
          fi
          if ! grep -q 'translated=' "$EVID/mathir.log" 2>/dev/null; then
            { grep -n -E 'error' "$EVID/mathir.log" | head -25; echo '--- log tail ---'; tail -15 "$EVID/mathir.log";
              echo '--- progress.log tail (timestamps from start of the #eval) ---'; tail -25 "$EVID/gen/progress.log"; } > "$RUNNER_TEMP/e.txt" 2>/dev/null || true
            $A error "MathIR errors and log tail" "$RUNNER_TEMP/e.txt" 45
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathir-lean
          path: evidence/

  arm:
    needs: lean
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mathir-lean
          path: lean-evidence

      - name: Generated files are exactly the Lean job's
        run: cd lean-evidence/gen && sha256sum -c ../gen.sha256

      - uses: docker/setup-buildx-action@v3

      - name: Build toolchain image (cached)
        uses: docker/build-push-action@v6
        with:
          context: lean-m2
          file: lean-m2/docker/Dockerfile
          platforms: linux/arm64
          load: true
          tags: lean-m2-workstation:mathir
          cache-from: type=gha,scope=lean-m2
          cache-to: type=gha,scope=lean-m2,mode=max

      - name: CompCert + gm2 build of generated code; differential and acceptance tests
        run: |
          mkdir -p out
          docker run --rm --platform linux/arm64 -u "$(id -u):$(id -g)" \
            -v "$PWD/lean-m2:/lm2:ro" -v "$PWD/lean-evidence:/ev:ro" -v "$PWD/out:/out" \
            lean-m2-workstation:mathir \
            bash /lm2/g3/gen/run.sh /lm2 /ev/gen /ev/slice001 /out

      - name: Publish evidence as annotations
        if: always()
        run: |
          A=lean-m2/scripts/annotate.sh
          { grep -E 'MATHIR|SLICE001|exit=|machine=' out/build.log | grep -v 'MATHIR INCOMPLETE' || true; } > "$RUNNER_TEMP/r.txt"
          $A notice "MathIR ARM results" "$RUNNER_TEMP/r.txt" 40
          { grep 'MATHIR INCOMPLETE' out/build.log || true; } > "$RUNNER_TEMP/inc.txt"
          [ -s "$RUNNER_TEMP/inc.txt" ] && $A notice "MathIR incomplete by function" "$RUNNER_TEMP/inc.txt" 400
          if ! grep -q 'DIFFERENTIAL: PASS' out/gen-test.log 2>/dev/null || ! grep -q 'DIFFERENTIAL: PASS' out/acceptance.log 2>/dev/null; then
            grep -n -E 'error|Error|BLOCKED|UNSOUND|FAIL' out/build.log | head -40 > "$RUNNER_TEMP/e.txt" || true
            $A error "MathIR ARM failures (first 40)" "$RUNNER_TEMP/e.txt" 40
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathir-arm
          path: out/
