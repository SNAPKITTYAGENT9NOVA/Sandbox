contract:
  id: LEAN-M2-CC-001
  schema_version: "1.0.0"
  status: specification-frozen
  correctness_policy: computational
  fail_closed: true

source:
  # Observed 2026-10-14 from google-deepmind/formal-conjectures @ 84cf7f8adfb0ea8d14c7d00bdf145cc9032bdf88.
  # Full corpus identity and per-directory inventory: corpus.lock.yaml.
  language: Lean4
  version: "leanprover/lean4:v4.33.1"        # contents of the project's lean-toolchain file
  project_root: formal-conjectures             # clone of the repository above, at that commit
  lean_toolchain_file_sha256: 3aac669c7a910ec2389f4e4f921b605adf6ebf2d1e0c9b9cd0be4d33f3f5db71
  lake_manifest_sha256: c8ffc0d59f492007162fe54c68396e4b9f2f305fcf69210a7fbaf0b18fcd8cd9
  source_tree_sha256: 66015949b2da0cb5f379f1ee5aec9e782e936da1e7f8360ec5f61bfe4a0709d9   # definition: corpus.lock.yaml
  read_only: true

lean:
  executable: lean
  version: "4.33.1 (819816b2e0a3bf405af45ae5c7af2491d8f5bee6)"   # observed in G2 and SLICE-001 runs
  lake_executable: lake
  lake_version: REQUIRED
  dependency_lock: lake-manifest.json
  kernel_validation: required
  unresolved_imports: reject
  preserve_axiom_inventory: true

mathir:
  schema_version: "1.0.0"
  canonical_serialization: "mathir.json = Lean Json.pretty, UTF-8, trailing LF; byte-reproducibility enforced by gen.sha256 across CI jobs and by the release gate"
  stable_declaration_ids: true
  preserve_source_locations: true
  preserve_dependencies: true
  preserve_semantic_domains: true

compcert:
  executable: ccomp
  version: "3.18"
  target: aarch64-linux
  object_format: ELF
  architecture: AArch64
  abi: AAPCS
  c_language: C99
  compiler_path: REQUIRED
  compiler_sha256: REQUIRED
  configuration_sha256: REQUIRED
  external_toolchain:
    preprocessor: REQUIRED
    assembler: REQUIRED
    linker: REQUIRED
    sysroot: REQUIRED
    target_triple: REQUIRED
  unsupported_constructs: reject
  compiler_substitution: forbidden

modula2:
  compiler: gm2
  version: "13.3.0 (Ubuntu 13.3.0-6ubuntu2~24.04.1)"   # observed, SLICE-001 run 38686128245
  executable_path: REQUIRED
  executable_sha256: REQUIRED
  gcc_version: "13.3.0"                     # observed
  target_triple: aarch64-linux-gnu          # observed (gm2 -dumpmachine)
  object_format: ELF
  target_architecture: AArch64
  target_os: Linux
  language_dialect: ISO                     # selected and used (gm2 -fiso)
  runtime_library: REQUIRED
  runtime_version: REQUIRED
  standard_library_fingerprint: REQUIRED

abi:
  contract_version: "1.0.0"
  calling_convention: AAPCS64
  endianness: little
  pointer_width_bits: 64
  integer_types: fixed_width
  aggregate_arguments_by_value: forbidden
  aggregate_returns_by_value: forbidden
  pointer_ownership: explicit
  buffer_lengths: explicit
  string_encoding: UTF-8
  symbol_manifest: required
  layout_probe: required
  link_probe: required
  runtime_probe: required

testing:
  reference: Lean4
  compare_c_and_modula2: true
  deterministic_test_seeds: required
  boundary_tests: required
  property_tests: required
  floating_point_policy: per_type
  test_results_hash: required

provenance:
  source_hashes: required
  generated_artifact_hashes: required
  command_log: required
  environment_manifest: required
  verification_ledger: required

release:
  require_all_mandatory_gates: true
  allow_unverified_as_verified: false
  retain_failed_artifacts: true
